name: Envoi veille presse

# Lit systématiquement la colonne « Sélectionné » du Google Sheet — jamais un
# nom de fichier tapé/transmis à la main. Un même PDF « revue de presse » peut
# compiler plusieurs coupures (même Nom fichier PDF, Pages PDF différentes) ;
# seule une lecture ligne par ligne du Sheet lève l'ambiguïté correctement.
# Historique : cet input texte libre a causé 3 envois erronés à Stéphanie le
# 2026-07-31 (métadonnées et PDF fusionné faux dès que plusieurs coupures
# partageaient le même fichier).
on:
  workflow_dispatch:
    inputs:
      # DÉLIBÉRÉMENT IGNORÉ. Conservé uniquement parce que la page de sélection
      # (repo procivis-veille-interne) le transmet encore : sans cette
      # déclaration, l'API GitHub rejette l'appel en HTTP 422 « Unexpected
      # inputs provided ». Ne JAMAIS le rebrancher sur `envoi --names` : la
      # sélection fait foi côté Sheet. À supprimer une fois la page nettoyée.
      selected_files:
        description: "IGNORÉ — la sélection est lue dans le Sheet (colonne « Sélectionné »)"
        required: false
        type: string

jobs:
  envoi:
    runs-on: ubuntu-latest
    environment: Veille presse interne

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          rm -f /etc/apt/sources.list.d/*deadsnakes* /etc/apt/sources.list.d/*ondrej*
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-fra

      - name: Install Python dependencies
        run: pip install gspread google-auth requests pypdf cryptography cffi

      - name: Run ENVOI (sélection lue depuis le Sheet)
        env:
          OUTLOOK_TENANT: ${{ secrets.OUTLOOK_TENANT }}
          OUTLOOK_CLIENT_ID: ${{ secrets.OUTLOOK_CLIENT_ID }}
          OUTLOOK_CLIENT_SECRET: ${{ secrets.OUTLOOK_CLIENT_SECRET }}
          OUTLOOK_USER: ${{ secrets.OUTLOOK_USER }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python3 lance_veille_local.py envoi
