name: Envoi veille presse

# Deux chemins d'entrée, un seul pivot : le Google Sheet.
#
# 1. Bouton de la page HTML → input `selected_files` au format
#    « fichier.pdf@debut-fin,... » (la plage de pages est OBLIGATOIRE pour toute
#    coupure d'un PDF « revue de presse » compilé — colonne « Pages PDF »).
#    Le job commence alors par `select` : validation stricte de CHAQUE entrée
#    contre le Sheet (la moindre inconnue → échec, rien d'écrit, aucun mail),
#    puis report de la sélection dans la colonne « Sélectionné » (TRUE/FALSE).
#    Ensuite `envoi --names` expédie dans l'ordre choisi sur la page.
# 2. Sélection cochée directement dans le Sheet → input vide → `envoi` lit la
#    colonne « Sélectionné », dans l'ordre des lignes.
#
# Historique : des noms transmis SANS plage de pages ont causé 3 envois erronés
# à Stéphanie le 2026-07-31. C'est le garde-fou de `select`/`envoi` (sortie en
# erreur sur non-correspondance) qui rend l'input de nouveau utilisable.
on:
  workflow_dispatch:
    inputs:
      selected_files:
        description: "Sélection de la page (fichier.pdf@debut-fin,...) — vide = lire la colonne « Sélectionné » du Sheet"
        required: false
        type: string

jobs:
  envoi:
    runs-on: ubuntu-latest
    environment: Veille presse interne

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          rm -f /etc/apt/sources.list.d/*deadsnakes* /etc/apt/sources.list.d/*ondrej*
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-fra

      - name: Install Python dependencies
        run: pip install gspread google-auth requests pypdf cryptography cffi

      - name: Run SELECT + ENVOI
        env:
          OUTLOOK_TENANT: ${{ secrets.OUTLOOK_TENANT }}
          OUTLOOK_CLIENT_ID: ${{ secrets.OUTLOOK_CLIENT_ID }}
          OUTLOOK_CLIENT_SECRET: ${{ secrets.OUTLOOK_CLIENT_SECRET }}
          OUTLOOK_USER: ${{ secrets.OUTLOOK_USER }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SELECTED_FILES: ${{ inputs.selected_files }}
        run: |
          if [ -n "$SELECTED_FILES" ]; then
            # Sélection venue de la page : report validé dans le Sheet, puis
            # envoi dans l'ordre choisi sur la page. Si `select` échoue
            # (entrée sans correspondance), le job s'arrête ici — aucun mail.
            python3 lance_veille_local.py select --names "$SELECTED_FILES"
            python3 lance_veille_local.py envoi --names "$SELECTED_FILES"
          else
            # Sélection cochée directement dans le Sheet.
            python3 lance_veille_local.py envoi
          fi
